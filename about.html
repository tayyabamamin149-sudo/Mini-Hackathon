<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mercedes GLK 300 4MATIC Coupe</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #222328;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           NAVBAR
        ========================= */

        .main-navbar {
            height: 85px;
            padding: 0 32px;
        }

        .site-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 21px;
            font-weight: 400;
        }

        .logo-mark {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 23px;
        }

        .logo-mark span {
            display: block;
            width: 4px;
            background: #fff;
            border-radius: 3px;
        }

        .logo-mark span:nth-child(1) {
            height: 19px;
        }

        .logo-mark span:nth-child(2) {
            height: 11px;
        }

        .logo-mark span:nth-child(3) {
            height: 20px;
        }

        .navbar-nav {
            gap: 40px;
        }

        .navbar-nav .nav-link {
            color: #fff;
            font-size: 15px;
            padding: 0 !important;
            transition: .3s;
        }

        .navbar-nav .nav-link:hover {
            color: #d33d83;
        }

        /* =========================
           HERO
        ========================= */

        .hero-section {
            min-height: calc(100vh - 85px);
            position: relative;
            overflow: hidden;
            padding-top: 45px;
        }

        .hero-title {
            text-align: center;
            font-size: 50px;
            line-height: 1.2;
            font-weight: 300;
            margin-bottom: 30px;
        }

        .hero-title strong {
            font-weight: 700;
        }

        /* =========================
           BUTTON
        ========================= */

        .more-btn {
            display: block;
            margin: 0 auto;
            width: 150px;
            height: 50px;
            border-radius: 30px;
            border: 1px solid #fff;
            color: #fff;
            font-size: 16px;
            background: linear-gradient(
                90deg,
                #d52e68,
                #74388e
            );
            transition: .3s;
        }

        .more-btn:hover {
            transform: scale(1.04);
            color: #fff;
        }

        /* =========================
           CAR AREA
        ========================= */

        .car-area {
            position: relative;
            max-width: 1000px;
            height: 470px;
            margin: 20px auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .car-image {
            width: 900px;
            max-width: 90%;
            position: relative;
            z-index: 2;
            object-fit: contain;
            filter: drop-shadow(
                0 25px 15px rgba(0,0,0,.55)
            );
        }

        /* =========================
           LEFT SPEC
        ========================= */

        .spec-left {
            position: absolute;
            left: -100px;
            top: 105px;
            z-index: 5;
        }

        .spec-right {
            position: absolute;
            right: -100px;
            top: 105px;
            z-index: 5;
            text-align: right;
        }

        .spec-title {
            color: #ff433b;
            font-size: 25px;
            font-style: italic;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .spec-value {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .spec-small {
            font-size: 18px;
            color: #ddd;
            font-weight: 300;
        }

        /* =========================
           SOCIAL ICONS
        ========================= */

        .social-icons {
            position: absolute;
            left: 30px;
            bottom: 25px;
            display: flex;
            gap: 18px;
            z-index: 10;
        }

        .social-icons a {
            color: #ddd;
            font-size: 19px;
            text-decoration: none;
            transition: .3s;
        }

        .social-icons a:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        /* =========================
           SLIDER DOTS
        ========================= */

        .slider-dots {
            position: absolute;
            right: 42px;
            bottom: 28px;
            display: flex;
            gap: 32px;
            z-index: 10;
        }

        .slider-dots span {
            width: 9px;
            height: 9px;
            background: #fff;
            border-radius: 50%;
            display: block;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1200px) {

            .hero-title {
                font-size: 44px;
            }

            .car-area {
                max-width: 850px;
            }

            .car-image {
                width: 800px;
            }

            .spec-left {
                left: -100px;
            }

            .spec-right {
                right: -100px;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 991px) {

            .main-navbar {
                height: auto;
                padding: 20px;
            }

            .navbar-nav {
                gap: 20px;
                margin-top: 25px;
                text-align: center;
            }

            .hero-section {
                padding-top: 35px;
                min-height: auto;
                padding-bottom: 100px;
            }

            .hero-title {
                font-size: 36px;
                padding: 0 20px;
            }

            .car-area {
                height: auto;
                margin-top: 50px;
                display: block;
                padding: 0 20px;
            }

            .car-image {
                width: 100%;
                max-width: 700px;
                display: block;
                margin: 0 auto;
            }

            .spec-left,
            .spec-right {
                position: relative;
                left: auto;
                right: auto;
                top: auto;
                text-align: center;
                margin-top: 30px;
            }

            .spec-right {
                margin-top: 25px;
            }

            .social-icons {
                left: 20px;
                bottom: 20px;
            }

            .slider-dots {
                right: 20px;
                bottom: 22px;
                gap: 18px;
            }
        }

        @media (max-width: 575px) {

            .site-logo {
                font-size: 19px;
            }

            .hero-title {
                font-size: 30px;
            }

            .more-btn {
                width: 140px;
                height: 46px;
            }

            .car-area {
                margin-top: 35px;
            }

            .spec-title {
                font-size: 22px;
            }

            .spec-value {
                font-size: 18px;
            }

            .spec-small {
                font-size: 16px;
            }

            .social-icons {
                position: relative;
                left: auto;
                bottom: auto;
                justify-content: center;
                margin-top: 50px;
            }

            .slider-dots {
                position: relative;
                right: auto;
                bottom: auto;
                justify-content: center;
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-expand-lg main-navbar">

    <div class="container-fluid">

        <a href="#" class="site-logo">

            <span class="logo-mark">
                <span></span>
                <span></span>
                <span></span>
            </span>

            SiteLogo

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainMenu"
            aria-controls="mainMenu"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>


        <div class="collapse navbar-collapse justify-content-end" id="mainMenu">

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="features.html">Features</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="pricing.html">Pricing</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Gallery</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Team</a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero-section">

    <div class="container-fluid">

        <h1 class="hero-title">
            Mercedes <strong>GLK 300 4MATIC</strong> Coupe
        </h1>


        <button class="more-btn">
            MORE
        </button>


        <!-- CAR AREA -->

        <div class="car-area">

            <!-- LEFT INFO -->

            <div class="spec-left">

                <div class="spec-title">
                    Engine
                </div>

                <div class="spec-value">
                    249 HP
                </div>

                <div class="spec-small">
                    7.33 Kmpl
                </div>

            </div>


            <!-- CAR IMAGE -->

            <img
                src="./hero/image.png"
                alt="Mercedes GLK 300 4MATIC Coupe"
                class="car-image"
            >


            <!-- RIGHT INFO -->

            <div class="spec-right">

                <div class="spec-title">
                    Max Speed
                </div>

                <div class="spec-value">
                    240 km/h
                </div>

                <div class="spec-small">
                    6.3 sec
                </div>

            </div>

        </div>


        <!-- SOCIAL ICONS -->

        <div class="social-icons">

            <a href="#">
                <i class="bi bi-facebook"></i>
            </a>

            <a href="#">
                <i class="bi bi-twitter-x"></i>
            </a>

            <a href="#">
                <i class="bi bi-instagram"></i>
            </a>

            <a href="#">
                <i class="bi bi-youtube"></i>
            </a>

        </div>


        <!-- SLIDER DOTS -->

        <div class="slider-dots">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
