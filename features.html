<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landing Page</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
        }

        .hero {
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.48), rgba(0, 0, 0, 0.48)),
                url("./hero/image20.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
        }

        .navbar {
            height: 65px;
            background: rgba(255, 255, 255, 0.15);
        }

        .navbar-brand {
            color: white !important;
            font-size: 22px;
            font-weight: 400;
        }

        .logo-lines {
            display: inline-flex;
            gap: 3px;
            margin-right: 7px;
            vertical-align: middle;
        }

        .logo-lines span {
            display: inline-block;
            width: 4px;
            height: 20px;
            border-radius: 1px;
        }

        .line1 {
            background: #ff3b8d;
        }

        .line2 {
            background: #ff9d00;
        }

        .line3 {
            background: #ffe600;
        }

        .navbar-nav .nav-link {
            color: white !important;
            font-size: 16px;
            margin-left: 28px;
        }

        .hero-content {
            min-height: calc(100vh - 65px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-content h1 {
            font-size: 42px;
            font-weight: 400;
            line-height: 1.15;
            margin-bottom: 42px;
        }

        .hero-content p {
            font-size: 17px;
            font-weight: 300;
            line-height: 1.3;
            max-width: 700px;
            margin: 0 auto 42px;
        }

        .watch-work {
            background: white;
            color: #111;
            border: none;
            border-radius: 30px;
            padding: 11px 36px;
            font-size: 16px;
        }

        .watch-work:hover {
            background: #f1f1f1;
        }

        .video-btn {
            display: inline-flex;
            align-items: center;
            color: white;
            text-decoration: none;
            margin-left: 28px;
            font-size: 16px;
        }

        .play-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #ff4d7d;
            border: 1px solid white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }

        .play-icon::after {
            content: "";
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 9px solid white;
            margin-left: 2px;
        }

        /* Mobile */
        @media (max-width: 768px) {

            .navbar {
                height: auto;
                text-align: center;
            }

            .navbar-nav .nav-link {
                margin-left: 0;
                padding: 8px 0;
            }

            .hero-content {
                min-height: calc(100vh - 70px);
                padding: 40px 20px;
            }

            .hero-content h1 {
                font-size: 32px;
                margin-bottom: 30px;
            }

            .hero-content p {
                font-size: 15px;
                margin-bottom: 30px;
            }

            .watch-work {
                padding: 10px 28px;
            }

            .video-btn {
                margin-left: 10px;
            }
        }

        @media (max-width: 450px) {

            .hero-content h1 {
                font-size: 28px;
            }

            .hero-buttons {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 18px;
            }

            .video-btn {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

<section class="hero">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="#">
                <span class="logo-lines">
                    <span class="line1"></span>
                    <span class="line2"></span>
                    <span class="line3"></span>
                </span>
                SiteLogo
            </a>

            <button
                class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="features.html">Features</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pricing.html">Pricing</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Gallery</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Team</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Hero Content -->
    <div class="hero-content">

        <div class="container">

            <h1>
                Clean &amp; Professional header<br>
                to your Landing Page
            </h1>

            <p>
                If you want to deliver a smooth customer experience and look good while doing it, a<br>
                web designer can help.
            </p>

            <div class="hero-buttons">

                <button class="watch-work">
                    Watch work
                </button>

                <a href="#" class="video-btn">
                    <span class="play-icon"></span>
                    Watch video
                </a>

            </div>

        </div>

    </div>

</section>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
