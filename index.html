<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Learning Platform</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f5ff;
            color: #111;
            overflow-x: hidden;
        }

        /* =========================
           HEADER
        ========================= */

        .main-header {
            padding: 32px 0;
            position: relative;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: #111;
            font-size: 20px;
            font-weight: 400;
        }

        .logo-bars {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .logo-bars span {
            width: 4px;
            border-radius: 4px;
            display: block;
        }

        .logo-bars span:nth-child(1) {
            height: 19px;
            background: #f62c73;
        }

        .logo-bars span:nth-child(2) {
            height: 13px;
            background: #ffad1f;
        }

        .logo-bars span:nth-child(3) {
            height: 19px;
            background: #00aeea;
        }

        .logo-bars span:nth-child(4) {
            height: 13px;
            background: #6556e9;
        }

        .navbar-nav {
            gap: 40px;
        }

        .navbar-nav .nav-link {
            color: #111;
            font-size: 15px;
            padding: 0 !important;
        }

        .navbar-nav .nav-link:hover {
            color: #6439db;
        }

        /* Contact Button */

        .contact-btn {
            width: 150px;
            height: 40px;
            border: 2px solid transparent;
            border-radius: 5px;
            background:
                linear-gradient(#f8f5ff, #f8f5ff) padding-box,
                linear-gradient(90deg, #3f7cff, #9a43e8) border-box;
            color: #111;
            font-size: 15px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: calc(100vh - 100px);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 700px;
            height: 500px;
            right: -100px;
            bottom: -180px;
            background: radial-gradient(
                circle,
                rgba(190, 92, 255, .48) 0%,
                rgba(190, 92, 255, .20) 35%,
                transparent 70%
            );
            filter: blur(30px);
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-title {
            font-size: 52px;
            line-height: 1.18;
            font-weight: 700;
            color: #32166c;
            max-width: 620px;
            margin-bottom: 32px;
        }

        .hero-title .gradient-text {
            display: block;
            background: linear-gradient(
                90deg,
                #bd4be4,
                #9b50e9
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            color: #5b5b63;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 55px;
            max-width: 580px;
        }

        /* =========================
           GET STARTED BUTTON
        ========================= */

        .get-started {
            width: 198px;
            height: 41px;
            border: 0;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            background: linear-gradient(
                90deg,
                #4779eb,
                #9145e8
            );
            box-shadow: 0 5px 12px rgba(82, 89, 200, .35);
            transition: .3s ease;
        }

        .get-started:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(82, 89, 200, .4);
        }

        /* =========================
           LAPTOP
        ========================= */

        .laptop-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .laptop-wrapper::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 250px;
            right: 10px;
            bottom: -20px;
            background: radial-gradient(
                ellipse,
                rgba(185, 86, 235, .45),
                transparent 70%
            );
            filter: blur(25px);
            z-index: -1;
        }

        .laptop-image {
            width: 750px;
            max-width: 110%;
            height: auto;
            transform: rotate(2deg);
            filter: drop-shadow(
                0 25px 25px rgba(60, 30, 80, .20)
            );
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1200px) {

            .hero-title {
                font-size: 46px;
            }

            .laptop-image {
                width: 650px;
                max-width: 125%;
            }

        }

        @media (max-width: 991px) {

            .main-header {
                padding: 20px 0;
            }

            .navbar-nav {
                gap: 20px;
                margin-top: 25px;
                align-items: center;
            }

            .contact-btn {
                margin-top: 20px;
            }

            .hero {
                min-height: auto;
                padding: 70px 0 80px;
            }

            .hero-content {
                text-align: center;
            }

            .hero-title {
                font-size: 43px;
                max-width: 700px;
                margin-left: auto;
                margin-right: auto;
            }

            .hero-description {
                margin-left: auto;
                margin-right: auto;
                margin-bottom: 35px;
            }

            .laptop-wrapper {
                margin-top: 70px;
            }

            .laptop-image {
                width: 700px;
                max-width: 100%;
            }

        }

        @media (max-width: 767px) {

            .hero {
                padding-top: 50px;
            }

            .hero-title {
                font-size: 38px;
            }

            .hero-description {
                font-size: 16px;
            }

            .get-started {
                width: 190px;
            }

            .laptop-wrapper {
                margin-top: 50px;
            }

            .laptop-image {
                width: 100%;
                transform: rotate(1deg);
            }

        }

        @media (max-width: 575px) {

            .hero {
                padding: 35px 0 60px;
            }

            .hero-title {
                font-size: 32px;
                line-height: 1.2;
            }

            .hero-description {
                font-size: 15px;
                line-height: 1.6;
                margin-bottom: 30px;
            }

            .get-started {
                height: 47px;
            }

            .laptop-wrapper {
                margin-top: 45px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="main-header">

        <div class="container">

            <nav class="navbar navbar-expand-lg">

                <!-- Logo -->

                <a href="#" class="logo">

                    <span class="logo-bars">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>

                    <span>SiteLogo</span>

                </a>


                <!-- Mobile Toggle -->

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>


                <!-- Menu -->

                <div
                    class="collapse navbar-collapse justify-content-end"
                    id="mainNavbar"
                >

                    <ul class="navbar-nav align-items-lg-center">

                        <li class="nav-item">
                            <a href="about.html" class="nav-link">
                                About
                            </a>
                        </li>

                        <li class="nav-item">
                            <a href="features.html" class="nav-link">
                                Features
                            </a>
                        </li>

                        <li class="nav-item">
                            <a href="pricing.html" class="nav-link">
                                Pricing
                            </a>
                        </li>

                        <li class="nav-item">
                            <a href="index.html" class="nav-link">
                                Gallery
                            </a>
                        </li>

                        <li class="nav-item">
                            <a href="#" class="nav-link">
                                Team
                            </a>
                        </li>

                        <li class="nav-item ms-lg-4">

                            <button class="contact-btn">
                                Contact Us
                            </button>

                        </li>

                    </ul>

                </div>

            </nav>

        </div>

    </header>


    <!-- =========================
         HERO
    ========================= -->

    <main class="hero">

        <div class="container">

            <div class="row align-items-center">

                <!-- LEFT SIDE -->

                <div class="col-lg-6 hero-content">

                    <h1 class="hero-title">

                        Launch your own online
                        learning platform

                        <span class="gradient-text">
                            for FREE
                        </span>

                    </h1>


                    <p class="hero-description">

                        Top teacher from around the world teach thousands
                        of students.<br>

                        Get unlimited access to 1000+ courses

                    </p>


                    <button class="get-started">
                        Get started
                    </button>

                </div>


                <!-- RIGHT SIDE -->

                <div class="col-lg-6">

                    <div class="laptop-wrapper">

                        <img
                            src="./hero/image13.png"
                            alt="Online Learning Platform"
                            class="laptop-image"
                        >

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
