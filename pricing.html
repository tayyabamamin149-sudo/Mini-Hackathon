<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Robot Landing Page</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .hero-section {
            min-height: 100vh;
            background: linear-gradient(
                90deg,
                #fff0bd 0%,
                #fff8df 42%,
                #ffffff 100%
            );
        }

        /* Navbar */
        .navbar {
            padding-top: 30px;
        }

        .logo {
            font-size: 22px;
            color: #111;
        }

        .logo-lines {
            display: inline-flex;
            gap: 4px;
            margin-right: 7px;
            vertical-align: middle;
        }

        .logo-lines span {
            width: 4px;
            height: 20px;
            border-radius: 3px;
        }

        .pink {
            background: #ff3b82;
        }

        .yellow {
            background: #ffb900;
        }

        .blue {
            background: #00a9e8;
        }

        .navbar-nav .nav-link {
            color: #111;
            font-size: 15px;
            margin: 0 13px;
        }

        .navbar-nav .nav-link:hover {
            color: #ff8c35;
        }

        .contact-btn {
            border: none;
            color: white;
            padding: 11px 31px;
            border-radius: 30px;
            background: linear-gradient(
                90deg,
                #ffdb43,
                #ff9b45
            );
            font-size: 15px;
        }

        .social-icons a {
            color: #111;
            font-size: 22px;
            margin-left: 15px;
            text-decoration: none;
        }

        /* Hero */
        .hero-content {
            min-height: calc(100vh - 95px);
        }

        .hero-text h1 {
            font-size: 52px;
            line-height: 1.15;
            font-weight: 700;
            color: #000;
            margin-bottom: 65px;
        }

        .hero-text p {
            font-size: 20px;
            line-height: 1.4;
            color: #111;
            max-width: 600px;
            margin-bottom: 58px;
        }

        .get-started {
            color: white;
            border: none;
            border-radius: 30px;
            padding: 14px 60px;
            font-size: 16px;
            background: linear-gradient(
                90deg,
                #ff4f57,
                #ffc91c
            );
        }

        .robot-img {
            width: 100%;
            max-width: 390px;
            height: auto;
        }

        /* Tablet */
        @media (max-width: 991px) {

            .navbar-nav {
                margin-top: 20px;
                text-align: center;
            }

            .navbar-nav .nav-link {
                margin: 5px 0;
            }

            .contact-btn {
                margin-top: 10px;
            }

            .social-icons {
                margin-top: 15px;
            }

            .hero-content {
                padding-top: 60px;
                padding-bottom: 60px;
            }

            .hero-text h1 {
                font-size: 44px;
                margin-bottom: 35px;
            }

            .hero-text p {
                font-size: 18px;
                margin-bottom: 35px;
            }

            .robot-img {
                max-width: 500px;
            }
        }

        /* Mobile */
        @media (max-width: 575px) {

            .navbar {
                padding-top: 15px;
            }

            .hero-content {
                text-align: center;
                padding-top: 50px;
            }

            .hero-text h1 {
                font-size: 35px;
                margin-bottom: 30px;
            }

            .hero-text p {
                font-size: 17px;
                margin: 0 auto 35px;
            }

            .get-started {
                padding: 12px 45px;
            }

            .robot-img {
                margin-top: 45px;
                max-width: 390px;
            }
        }
    </style>
</head>

<body>

<section class="hero-section">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand logo" href="#">
                <span class="logo-lines">
                    <span class="pink"></span>
                    <span class="yellow"></span>
                    <span class="blue"></span>
                </span>
                SiteLogo
            </a>

            <!-- Mobile Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="features.html">Features</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pricing.html">Pricing</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Gallery</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Team</a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <button class="contact-btn">
                            Contact Us
                        </button>
                    </li>

                    <!-- Social Icons -->
                    <li class="nav-item social-icons">
                        <a href="#">
                            <i class="bi bi-facebook"></i>
                        </a>

                        <a href="#">
                            <i class="bi bi-twitter-x"></i>
                        </a>

                        <a href="#">
                            <i class="bi bi-instagram"></i>
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Hero -->
    <div class="container">
        <div class="row hero-content align-items-center">

            <!-- Left Side -->
            <div class="col-lg-6 hero-text">

                <h1>
                    GIVE ROBOTS<br>
                    A SECOND CHANCE
                </h1>

                <p>
                    We save 1 million robots from destruction every year and find
                    a new home for them. Let's save the robots!
                </p>

                <button class="get-started">
                    Get started
                </button>

            </div>


            <!-- Right Side -->
            <div class="col-lg-6 text-center">

                <img
                    src="./hero/image12.png"
                    alt="Robot"
                    class="robot-img"
                >

            </div>

        </div>
    </div>

</section>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
